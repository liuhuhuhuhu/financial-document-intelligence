
services:
  api:
    build:
      context: ./backend
    ports:
      - "8002:8000"
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:1.3.5
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data

volumes:
  chroma_data:
